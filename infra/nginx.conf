# StockFlow reverse proxy (your host nginx). TLS via certbot/Let's Encrypt.
# The /api/stream/ block disables buffering — required so Server-Sent Events stream
# in real time (otherwise the live dashboard/inventory updates would be held back).

server {
    listen 80;
    server_name retail-automation.infosoftco.com;
    # certbot will manage the 80->443 redirect + cert; or add it manually.
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name retail-automation.infosoftco.com;

    ssl_certificate     /etc/letsencrypt/live/retail-automation.infosoftco.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/retail-automation.infosoftco.com/privkey.pem;

    client_max_body_size 10m;

    # App (the container publishes on 127.0.0.1:3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Server-Sent Events (live updates) — must NOT be buffered.
    location /api/stream/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
    }
}

# Add once in the http{} block of nginx.conf if not already present:
# map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# Production stack for a single VPS.
#   docker compose -f infra/docker-compose.full.yml --env-file infra/.env.deploy up -d --build
#
# Front it with YOUR nginx (see infra/nginx.conf) — web is published on 127.0.0.1:3000.
# Or run the bundled Caddy for automatic HTTPS:  add  --profile tls
name: stockflow

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stockflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-stockflow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-stockflow}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: apply DB migrations, then exit. web/worker wait for it to finish.
  migrate:
    image: stockflow-web:local
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    command: ['pnpm', '--filter', '@stockflow/db', 'migrate:deploy']
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  web:
    image: stockflow-web:local
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?set NEXTAUTH_URL}
      NODE_ENV: production
    # Published on loopback for your nginx to reverse-proxy.
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    image: stockflow-worker:local
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      DEMO_ORDER_DRIP: ${DEMO_ORDER_DRIP:-off}
      NODE_ENV: production
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  # Optional zero-config HTTPS. Enable with:  --profile tls   (set DOMAIN in the env file)
  caddy:
    image: caddy:2-alpine
    profiles: ['tls']
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      - web

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
